name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push supersedes the running build.
concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # pnpm version comes from the "packageManager" field in package.json
      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: check
        run: pnpm check

      - name: build
        env:
          # GitHub Pages serves a project site under /<repo>/ — the app's paths.base
          # (see vite.config.ts) has to match. Derived from the repo name, so the same
          # workflow works on any repo the app is published from.
          BASE_PATH: /${{ github.event.repository.name }}
          # Optional repo variable: comma-separated collaboration-server URLs baked
          # into the client as one-click sign-in presets (Settings → Secrets → Variables)
          VITE_SERVERS: ${{ vars.VITE_SERVERS }}
        run: pnpm build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          # adapter-static output (pages + assets both go to build/)
          path: build/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
